<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspaditas Premium</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;padding:16px;margin:0}
.box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:32px;font-weight:900;text-align:center}
.amarillo{color:#facc15}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;margin:6px 0 12px;box-sizing:border-box}
button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:8px}
.btnA{background:#facc15;color:#000}.btnV{background:#22c55e;color:#fff}.btnG{background:#334155;color:#fff}
table{width:100%;font-size:13px}td{padding:8px 4px;border-bottom:1px solid #334155}
#prize-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#020617;padding:10px;border-radius:16px;aspect-ratio:1}
.cell{background:#1e293b;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}
.cell small{font-size:11px;color:#cbd5e1;font-weight:800}
#scratch-wrap{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;touch-action:none}
.win{border:3px solid #facc15;box-shadow:0 0 15px #facc15}
.oculto{display:none!important}
</style>
</head>
<body>

<div id="admin-panel">
<h1 style="color:#facc15">Raspaditas Premium</h1>
<div class="grid2">
<div class="box"><small>TOTAL DE CARTONES GENERADOS</small><div class="big" id="stat-total">0</div></div>
<div class="box"><small>TOTAL PREMIADO</small><div class="big amarillo" id="stat-premiado">Gs. 0</div><small id="stat-count">0 cartones con premio</small></div>
</div>

<div class="box">
<h3>✨ Configurar Enlace</h3>
Nombre del Jugador<br><input id="input-player" placeholder="Ej: Juan Perez">
Tipo<br><select id="select-mode"><option value="aleatorio">Aleatorio (30% Ganar)</option><option value="ganador">Forzar Ganador</option><option value="perdedor">Forzar Sin Premio</option></select>
Premio<br><select id="select-prize"><option value="5000">Gs. 5.000</option><option value="10000">Gs. 10.000</option><option value="20000">Gs. 20.000</option><option value="50000">Gs. 50.000</option><option value="100000">Gs. 100.000</option><option value="500000">Gs. 500.000</option><option value="1000000">Gs. 1.000.000</option><option value="3000000">Gs. 3.000.000</option><option value="5000000">Gs. 5.000.000</option></select>
<button class="btnA" onclick="crear()">Generar Enlace Personalizado</button>
</div>

<div class="box"><h3>Enlaces Activos</h3><div id="lista"></div><button class="btnG" onclick="if(confirm('¿Borrar todo?')){db={};guardar()}">Reiniciar Base de Datos</button></div>
</div>

<div id="game-panel" class="oculto">
<h2 style="text-align:center">¡Tu Raspadita!</h2>
<p id="welcome" style="text-align:center;color:#facc15"></p>
<div id="scratch-wrap"><div id="prize-grid"></div><canvas id="canvas"></canvas></div>
<div id="resultado" class="box oculto" style="text-align:center;margin-top:14px"><h2 id="res-t"></h2><p id="res-s"></p><div id="res-wa"></div></div>
</div>

<div id="error-panel" class="oculto" style="text-align:center;padding:40px 0"><h2>🔒 Enlace Inválido o Ya Utilizado</h2><p>Pedí un nuevo enlace a tu vendedor.</p></div>

<script>
let db=JSON.parse(localStorage.getItem('db_raspa')||'{}');
let audio=null;
function sonido(g){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),gn=audio.createGain();o.type='triangle';o.frequency.value=g;gn.gain.setValueAtTime(0.15,audio.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+0.4);o.connect(gn);gn.connect(audio.destination);o.start();o.stop(audio.currentTime+0.4)}catch(e){}}
function guardar(){localStorage.setItem('db_raspa',JSON.stringify(db));mostrar()}
let TEMAS={5000:'🐶',10000:'🐱',20000:'🦊',50000:'🦁',100000:'🐷',500000:'🐼',1000000:'🦄',3000000:'🐉',5000000:'👑'};
let PREMIOS=[5000,10000,20000,50000,100000,500000,1000000,3000000,5000000];
function fmt(n){return 'Gs. '+Number(n).toLocaleString('es-PY')}
function crear(){
let nombre=document.getElementById('input-player').value||'Jugador Anonimo';
let modo=document.getElementById('select-mode').value;
let elegido=Number(document.getElementById('select-prize').value);
let win=false,premio=0;
if(modo=='aleatorio'){win=Math.random()<0.3;premio=win?PREMIOS[Math.floor(Math.random()*PREMIOS.length)]:0}
else if(modo=='ganador'){win=true;premio=elegido}
let pool=[];
if(win){pool=[premio,premio,premio];while(pool.length<9){let r=PREMIOS[Math.floor(Math.random()*PREMIOS.length)];if(r!=premio&&pool.filter(x=>x==r).length<2)pool.push(r)}}
else{while(pool.length<9){let r=PREMIOS[Math.floor(Math.random()*PREMIOS.length)];if(pool.filter(x=>x==r).length<2)pool.push(r)}}
pool.sort(()=>Math.random()-0.5);
let id='tkt_'+Date.now();
db[id]={player:nombre,win:win,prize:premio,symbols:pool,status:'disponible'};
document.getElementById('input-player').value='';guardar();
}
function mostrar(){
let keys=Object.keys(db).reverse();
let total=keys.length,totalGs=0,con=0;
keys.forEach(k=>{if(db[k].win){totalGs+=db[k].prize;con++}});
document.getElementById('stat-total').innerText=total;
document.getElementById('stat-premiado').innerText=fmt(totalGs);
document.getElementById('stat-count').innerText=con+' cartones con premio';
let h='';
keys.forEach(k=>{
let it=db[k];
let obj={p:it.player,w:it.win,z:it.prize,s:it.symbols};
let enc=btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
let url=location.origin+location.pathname+'?id='+k+'&d='+enc;
let wa='https://wa.me/?text='+encodeURIComponent('Hola '+it.player+'! Tu raspadita: '+url);
h+='<div style="border-bottom:1px solid #334155;padding:10px 0"><b>'+it.player+'</b> - '+(it.win?fmt(it.prize):'Sin premio')+' - '+(it.status=='disponible'?'🟢 Disponible':'🔴 Ya raspado')+'<br><button class="btnG" onclick="copiar(\''+url+'\')">📄 Copiar</button> <a href="'+wa+'" target="_blank"><button class="btnV">💬 WhatsApp</button></a> <button class="btnG" onclick="borrar(\''+k+'\')">🗑️</button></div>';
});
document.getElementById('lista').innerHTML=h||'Todavía no hay enlaces.';
}
function copiar(u){navigator.clipboard?navigator.clipboard.writeText(u).then(()=>alert('¡Copiado!')):prompt('Copiá:',u)}
function borrar(id){if(confirm('¿Borrar?')){delete db[id];guardar()}}

let params=new URLSearchParams(location.search);
let tid=params.get('id'), dat=params.get('d');
let playerData=null, canvas, ctx, dibujando=false, lx=0, ly=0;

if(tid&&dat){
document.getElementById('admin-panel').classList.add('oculto');
let usados=JSON.parse(localStorage.getItem('usados')||'{}');
if(usados[tid]){document.getElementById('error-panel').classList.remove('oculto')}
else{
try{playerData=JSON.parse(decodeURIComponent(escape(atob(dat))))}catch(e){document.getElementById('error-panel').classList.remove('oculto')}
if(playerData){
document.getElementById('game-panel').classList.remove('oculto');
document.getElementById('welcome').innerText='¡Bienvenido/a, '+playerData.p+'!';
let grid=document.getElementById('prize-grid');
playerData.s.forEach((v,i)=>{
let d=document.createElement('div');d.className='cell';d.id='cell-'+i;d.setAttribute('data-v',v);d.innerHTML=TEMAS[v]+'<small>'+fmt(v)+'</small>';grid.appendChild(d);
});
iniciarRaspa();
}
}
}else{mostrar()}

function iniciarRaspa(){
canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');
let wrap=document.getElementById('scratch-wrap');
canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;
ctx.fillStyle='#64748b';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('⚡ RASPA AQUÍ ⚡',canvas.width/2,canvas.height/2);
ctx.globalCompositeOperation='destination-out';
function pos(e){let r=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function start(e){dibujando=true;let p=pos(e);lx=p.x;ly=p.y}
function move(e){if(!dibujando)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.lineWidth=40;ctx.lineCap='round';ctx.stroke();lx=p.x;ly=p.y;revisar()}
function end(){dibujando=false}
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
}
function revisar(){
let d=ctx.getImageData(0,0,canvas.width,canvas.height);let tot=0;
for(let i=3;i<d.data.length;i+=4){if(d.data[i]==0)tot++}
let porc=(tot/(canvas.width*canvas.height))*100;
if(porc>45)finalizar();
}
function finalizar(){
if(canvas.style.display=='none')return;
let usados=JSON.parse(localStorage.getItem('usados')||'{}');usados[tid]=true;localStorage.setItem('usados',JSON.stringify(usados));
if(db[tid]){db[tid].status='raspado';localStorage.setItem('db_raspa',JSON.stringify(db))}
canvas.style.transition='opacity .5s';canvas.style.opacity=0;setTimeout(()=>canvas.style.display='none',500);
let res=document.getElementById('resultado');res.classList.remove('oculto');
if(playerData.w){
for(let i=0;i<9;i++){let c=document.getElementById('cell-'+i);if(Number(c.getAttribute('data-v'))==playerData.z)c.classList.add('win')}
[523,659,784,1046].forEach((f,i)=>setTimeout(()=>sonido(f),i*120));
document.getElementById('res-t').innerText='¡FELICIDADES, GANASTE! 🏆';
document.getElementById('res-s').innerText='Premio: '+fmt(playerData.z);
document.getElementById('res-wa').innerHTML='<a href="https://wa.me/?text='+encodeURIComponent('Hola! Soy '+playerData.p+' y GANÉ '+fmt(playerData.z)+' Codigo: '+tid)+'" target="_blank"><button class="btnV">💬 Avisar a mi vendedor</button></a>';
}else{
document.getElementById('res-t').innerText='¡Intentalo de Nuevo! 🍀';
document.getElementById('res-s').innerText='Esta vez no coincidieron 3 figuras.';
document.getElementById('res-wa').innerHTML='<a href="https://wa.me/?text='+encodeURIComponent('Hola! Soy '+playerData.p+' ya raspé, no gané. Codigo: '+tid)+'" target="_blank"><button class="btnG">💬 Avisar a mi vendedor</button></a>';
}
}
</script>
</body>
</html>
